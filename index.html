<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover is what makes env(safe-area-inset-*) report anything
       other than 0 on iOS. Four places in this build already write
       `env(safe-area-inset-bottom, 0px)` and chat.css says in as many words
       that it returns "0 today as well since the viewport meta does not opt
       into viewport-fit=cover" — so the composer could not clear a home
       indicator, because the page was never told there was one. The rules were
       correct and inert; this is the line that switches them on.

       interactive-widget=resizes-content makes the soft keyboard shrink the
       LAYOUT viewport rather than only the visual one, so the fixed composer
       is lifted by the browser instead of being left underneath the keyboard.

       Neither changes anything on a desktop, where every inset is 0 and there
       is no soft keyboard — the 1536 reference is untouched. Matches AiMY
       Sales and AiMY QA. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>AiMY</title>

  <link rel="icon" type="image/svg+xml" href="assets/Aimy-full.svg" />
  <link rel="apple-touch-icon" href="assets/Aimy-full.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link rel="stylesheet" href="assets/aimy-ds.css?v=46" />
  <link rel="stylesheet" href="assets/knowledge.css?v=299" />
  <link rel="stylesheet" href="assets/chat.css?v=65" />

  <script>
    /* Apply saved theme before paint to avoid flash. Default = dark. */
    (function () {
      try {
        var saved = localStorage.getItem('aimy-ds-theme');
        if (saved === 'light') document.documentElement.setAttribute('data-theme', 'light');
      } catch (e) {}
    })();
  </script>
</head>
<!-- ══════════════════════════════════════════════
     THE GATE — chat, faced first

     Declared deviation #6. The direction document rejects a chat-first landing
     surface (§447) on the grounds that a prompt grid asks people to know what
     to ask at the moment they know least. That reasoning holds for somebody
     arriving without a question, and the briefing still serves them — one
     click away, in the Console.

     What it does not serve is the larger group who arrive knowing exactly what
     they want and have to cross a workbench to ask it. This page is for them.
     Nothing was removed to build it: the workbench is `console.html`, intact.

     `data-page` is the seam. knowledge.js reads it and boots a conversation
     and this shell — no grid, no filters, no briefing, no document machinery,
     because none of it has anywhere to render here.
══════════════════════════════════════════════ -->
<body data-page="gate" data-thread="empty">

<div class="gate-body">

  <!-- ══ CONVERSATIONS ══════════════════════════════════════════════════

       out of an overlay and given a permanent home. -->
  <aside class="gate-rail" id="gateRail" aria-label="Conversations">

    <!-- ══ RAIL HEADER ═══════════════════════════════════════════════════
         The collapse control lives with the thing it collapses. Claude,
         Gemini, Mistral, Grok and Perplexity all place it exactly here, in the
         panel's own top-right, and none of them put it in the product chrome —
         a control in the navbar reads as "app", and this one is "panel".

         `data-rail-toggle` rather than an id, because the collapsed state
         needs a second instance of the same button somewhere the closed panel
         is not: see `.gate-rail-peek` below. One attribute, one handler, two
         placements, only ever one of them on screen. -->
    <div class="gate-rail-head">
      <span class="gate-rail-title">Conversations</span>
      <button class="gate-rail-btn" type="button" data-rail-toggle
              aria-expanded="true" aria-controls="gateRail"
              aria-label="Collapse conversations" title="Collapse conversations">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg>
      </button>
    </div>

    <!-- The skeleton is what is true before knowledge.js has painted: rows
         are coming, and their shape is already known. `paintChats()` replaces
         it wholesale on the first render. If scripting fails it stays, which
         is the honest state — not an empty column implying no history. -->
    <div class="overlay-chats" id="overlayChats">
      <div class="gate-skeleton" aria-hidden="true">
        <div class="gate-skeleton-row" style="--i:0"></div>
        <div class="gate-skeleton-row" style="--i:1"></div>

        <div class="gate-skeleton-row" style="--i:4"></div>
      </div>
    </div>

         that gets found; this is the one that gets used, because it sits where
         the hand already is once somebody knows the page. -->
    <div class="gate-rail-foot">
      <a class="gate-console" href="console.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" width="15" height="15">
          <rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>
        <span class="gate-console-name">Console</span>
      </a>
    </div>
  </aside>

  <!-- Dismiss surface for the rail below 900px. Sibling of the rail so the two
       share one stacking context. -->
  <div class="gate-scrim" id="gateScrim"></div>

  <main class="gate-main">

    <!-- ══ THE AMBIENT LAYER ═════════════════════════════════════════════
         Two blurred ellipses that already exist as design-system tokens
         (`--grad-ellipse-1`, `--grad-ellipse-2`) at 0.07–0.18 alpha, which is
         why this reads as depth rather than as a neon gradient.

         Fixed and pointer-events:none so it never enters a scrolling
         container and never takes a click. Each layer drifts on its own
         cycle — 29s and 37s, coprime, so they never resynchronise into a
         visible beat. Transform and opacity only.

         It fades out when a conversation starts: a transcript should be read
         against a flat surface. -->
    <div class="gate-bloom" id="gateBloom" aria-hidden="true">
      <div class="gate-bloom-a"></div>
      <div class="gate-bloom-b"></div>
      <!-- Dust. Painted by chat.js from a fixed table so the field is the same
           every load and can be reviewed rather than rolled. -->
      <div class="gate-dust" id="gateDust"></div>
    </div>

    <!-- ══ THE WAY BACK ══════════════════════════════════════════════════
         A collapsed panel takes its own toggle with it. This is the second
         placement of the same control, sitting where the rail used to start,
         and it exists only while the rail is closed — the same move Claude and
         ChatGPT make when their sidebar goes away. -->
    <button class="gate-rail-peek" type="button" data-rail-toggle
            aria-expanded="false" aria-controls="gateRail"
            aria-label="Show conversations" title="Show conversations">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg>
    </button>

    <div class="gate-stage" id="gateStage">

      <!-- Present in the markup rather than injected, so it is on screen in
           the first paint instead of one frame after it. -->
      <div class="gate-hero" id="gateHero">
        <h1 class="gate-hello">Hello, <span id="gateName">Nour</span></h1>
        <p class="gate-sub">Ask across everything AiMY knows.</p>
      </div>

      <div class="overlay-thread" id="overlayThread" aria-live="polite"></div>

      <div class="gate-composer">
        <div class="overlay-input-wrap">
          <div class="overlay-input-bar">
            <div class="aimy-float-icon">
              <svg width="16" height="18" viewBox="0 0 18 20"><use href="#aimy-logo-small"/></svg>
            </div>
            <textarea class="overlay-input" id="overlayInput" placeholder="Ask me anything…" rows="1"
                      spellcheck="false" autocomplete="off" data-submit-on-enter aria-label="Ask AiMY"></textarea>

            <button class="overlay-send" id="overlaySend" aria-label="Send">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/></svg>
            </button>
          </div>
        </div>

        <!-- Below the input, which is where every product of this shape puts
             them. Painted by chat.js rather than written here so the set stays
             in one place next to the answer engine it was checked against. -->
        <div class="gate-chips" id="gateChips"></div>
      </div>

    </div>
  </main>
</div>

<div class="gate-toast-host" id="toastHost"></div>
<!-- Where a run and its receipt land. Outside the grid, because a commit can
     change the page under them and neither should be repainted away. -->
<div id="agentHost" hidden></div>
