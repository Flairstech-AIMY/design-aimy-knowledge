<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AiMY Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="popup.css">
</head>
<body class="panel-page gate-page" data-thread="empty" data-ticket-id="438516" data-phase="gate">
  <main class="gate-shell" id="gateShell">
    <!-- Two drifting blooms and a slow rise of dust. Behind everything, and
         outside the scrolling thread so it never repaints on scroll. -->
    <div class="gate-bloom" aria-hidden="true">
      <div class="gate-bloom-a"></div>
      <div class="gate-bloom-b"></div>
      <div class="gate-dust" id="gateDust"></div>
    </div>

    <!-- The mark is an empty box holding its place until the start screen's
         mark flies into it. -->
    <header class="brand">
      <span class="brand-lockup">
        <span class="brand-anchor" id="brandAnchor" aria-hidden="true"></span>
        <span class="brand-word" id="brandWord" hidden>AiMY</span>
        <span class="brand-ticket" id="brandTicket" hidden>Ticket #438516</span>
      </span>
      <div class="brand-actions">
        <button class="round-action" id="themeToggle" type="button" aria-label="Toggle theme" title="Toggle theme"><svg viewBox="0 0 24 24"><use href="#icon-sun"/></svg></button>
      </div>
    </header>

    <section class="gate-main" aria-labelledby="gateTitle">
      <div class="gate-content">
        <div class="gate-hero" id="emptyConversation"><h1 id="gateTitle">Hello, Nour</h1><p>Ask across everything AiMY knows.</p></div>
        <div class="gate-thread" id="gateThread" aria-live="polite"></div>
        <div class="inline-status" id="toast" role="status" aria-live="polite"></div>
        <div class="chat-actions"><div class="demo-tools"><button class="demo-tools-toggle" id="demoToolsToggle" type="button" aria-label="Show demo controls" aria-expanded="false" title="Demo controls">Demo</button><div class="demo-controls" id="demoControls" hidden><button id="demoRefresh" type="button" aria-label="Replay from the start screen" title="Replay from the start screen">↻</button><label class="demo-speed" for="demoSpeed"><span>Speed</span><input id="demoSpeed" type="range" min="0.25" max="3" step="0.25" value="1"><output id="demoSpeedValue">1x</output></label></div></div><button class="new-chat-button" id="newConversation" type="button" aria-label="Start a new chat" title="Start a new chat"><svg viewBox="0 0 24 24"><use href="#icon-plus-chat"/></svg><span>New chat</span></button></div>
        <form class="gate-composer" id="askForm"><span class="beam" aria-hidden="true"><i></i></span><span class="aimy-float-icon" aria-hidden="true"><img src="assets/aimy-full.svg" alt=""></span><label class="sr-only" for="question">Ask AiMY</label><textarea id="question" rows="1" placeholder="Ask about this ticket…" spellcheck="false" autocomplete="off"></textarea><button class="overlay-send" id="sendQuestion" type="submit" aria-label="Send" title="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/></svg></button></form>
        <div class="suggestions"><button type="button" data-prompt="Can EU customers get a refund after activating?">Can EU customers get a refund after activating?</button><button type="button" data-prompt="What does the corpus say about data residency?">What does the corpus say about data residency?</button><button type="button" data-prompt="Which articles contradict each other on refunds?">Which articles contradict each other on refunds?</button></div>
      </div>
    </section>

    <!-- The start screen: the ticket number, and one thing to press. Nothing
         is asked of AiMY until it is pressed. -->
    <section class="gate" id="gateStart" aria-label="Ticket 438516">
      <span class="gate-orbit" id="gateOrbit" aria-hidden="true"></span>
      <div class="gate-copy" id="gateCopy">
        <div class="gate-ticket"><span>Ticket</span><strong>#438516</strong></div>
        <p class="gate-hint">AiMY will read this ticket and suggest where to take it.</p>
        <button class="gate-start" id="gateStartButton" type="button"><span>Get started</span></button>
      </div>
    </section>
  </main>
  <svg class="icon-sprite" aria-hidden="true" focusable="false">
    <symbol id="icon-aimy" viewBox="0 0 24 24"><defs><radialGradient id="aimy-gradient-panel" cx="50%" cy="50%" r="60%"><stop offset="0" stop-color="#8c4ff4"/><stop offset=".55" stop-color="#3f5bf9"/><stop offset="1" stop-color="#06f"/></radialGradient></defs><path fill="url(#aimy-gradient-panel)" d="M12 1.6l1.7 3.1 2.9-1.4-.3 3.5 3.3.4-2.3 2.7 2.5 2.1-3.4.9.9 3.4-3.2-.8-1 3.4-2.3-2.7-2.7 2.2-.3-3.5-3.4-.2 2-2.9-2.5-2.1 3.3-.9-.9-3.4 3.2.8L12 1.6z"/><circle cx="12" cy="12" r="3.2" fill="#0f1215"/></symbol>
    <symbol id="icon-attach" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m20 11.5-7.8 7.8a5 5 0 0 1-7-7l7.5-7.5a3.5 3.5 0 0 1 5 5L10 17.5a2 2 0 0 1-2.8-2.8l7-7"/></symbol>
    <symbol id="icon-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></symbol>
    <symbol id="icon-note" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h10l4 4v12H5z"/><path d="M14 4v5h5M8 13h8M8 17h6"/></symbol>
    <symbol id="icon-like" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10v10H4a1 1 0 0 1-1-1v-8a1 1 0 0 1 1-1h3zM7 20h9.5a2 2 0 0 0 1.9-1.4l2.1-6.5A1.6 1.6 0 0 0 19 10h-4l.6-3.4A2.2 2.2 0 0 0 13.4 4L7 10z"/></symbol>
    <symbol id="icon-dislike" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 14V4H4a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h3zM7 4h9.5a2 2 0 0 1 1.9 1.4l2.1 6.5A1.6 1.6 0 0 1 19 14h-4l.6 3.4a2.2 2.2 0 0 1-2.2 2.6L7 14z"/></symbol>
    <symbol id="icon-tone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="m4 17 6-6 4 4 6-7M4 21h16"/></symbol>
    <symbol id="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="icon-plus-chat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M20 11.5a7.5 7.5 0 0 1-9.8 7.1L5 20l1.4-4.1A7.5 7.5 0 1 1 20 11.5zM12 8v7M8.5 11.5h7"/></symbol>
    <symbol id="icon-send" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4l16 8-16 8 3-8-3-8zM7 12h13"/></symbol>
    <symbol id="icon-file" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6zM14 3v5h4"/></symbol>
    <symbol id="icon-grid" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
  </svg>
  <script src="popup.js"></script>
</body>
</html>
