<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ask AiMY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar quick-topbar">
      <a class="brand" href="#" aria-label="AiMY home">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><use href="#icon-aimy"/></svg></span>
        <span>AiMY</span>
      </a>
      <div class="topbar-actions">
        <button class="icon-button" id="themeToggle" type="button" aria-label="Toggle theme" title="Toggle theme"><svg viewBox="0 0 24 24"><use href="#icon-sun"/></svg></button>
        <button class="icon-button" id="openPanel" type="button" aria-label="Open side panel" title="Open side panel"><svg viewBox="0 0 24 24"><use href="#icon-panel"/></svg></button>
      </div>
    </header>

    <section class="quick-welcome" aria-labelledby="welcomeTitle">
      <p class="eyebrow">AiMY</p>
      <h1 id="welcomeTitle">Ask AiMY.</h1>
      <p class="welcome-copy">Search your team's knowledge without leaving the page.</p>
    </section>

    <form class="ask-form" id="askForm">
      <label class="sr-only" for="question">Ask AiMY a question</label>
      <textarea id="question" rows="2" placeholder="Ask me anything..." autocomplete="off"></textarea>
      <div class="composer-foot">
        <span class="composer-hint">Enter to ask</span>
        <button class="send-button" type="submit" aria-label="Ask AiMY"><svg viewBox="0 0 24 24"><use href="#icon-send"/></svg></button>
      </div>
    </form>

    <footer class="footer-bar">
      <button class="workspace-link" id="openWorkspace" type="button"><svg viewBox="0 0 24 24"><use href="#icon-grid"/></svg> Open full Console</button>
      <span class="sync-status"><i></i> Synced</span>
    </footer>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <svg class="icon-sprite" aria-hidden="true" focusable="false">
    <symbol id="icon-aimy" viewBox="0 0 24 24"><defs><radialGradient id="aimy-gradient" cx="50%" cy="50%" r="60%"><stop offset="0" stop-color="#8c4ff4"/><stop offset=".55" stop-color="#3f5bf9"/><stop offset="1" stop-color="#06f"/></radialGradient></defs><path fill="url(#aimy-gradient)" d="M12 1.6l1.7 3.1 2.9-1.4-.3 3.5 3.3.4-2.3 2.7 2.5 2.1-3.4.9.9 3.4-3.2-.8-1 3.4-2.3-2.7-2.7 2.2-.3-3.5-3.4-.2 2-2.9-2.5-2.1 3.3-.9-.9-3.4 3.2.8L12 1.6z"/><circle cx="12" cy="12" r="3.2" fill="#0f1215"/></symbol>
    <symbol id="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="icon-panel" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></symbol>
    <symbol id="icon-send" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4l16 8-16 8 3-8-3-8zM7 12h13"/></symbol>
    <symbol id="icon-grid" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
  </svg>
  <script src="popup.js"></script>
</body>
</html>
