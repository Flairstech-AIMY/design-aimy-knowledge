<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover is what makes env(safe-area-inset-*) report anything
       other than 0 on iOS. Four places in this build already write
       `env(safe-area-inset-bottom, 0px)` and chat.css says in as many words
       that it returns "0 today as well since the viewport meta does not opt
       into viewport-fit=cover" — so the composer could not clear a home
       indicator, because the page was never told there was one. The rules were
       correct and inert; this is the line that switches them on.

       interactive-widget=resizes-content makes the soft keyboard shrink the
       LAYOUT viewport rather than only the visual one, so the fixed composer
       is lifted by the browser instead of being left underneath the keyboard.

       Neither changes anything on a desktop, where every inset is 0 and there
       is no soft keyboard — the 1536 reference is untouched. Matches AiMY
       Sales and AiMY QA. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>AiMY Console</title>

  <link rel="icon" type="image/svg+xml" href="assets/Aimy-full.svg" />

  <link rel="stylesheet" href="assets/knowledge.css?v=292" />
  <!-- The settings modules render into this page's stage now, so their
       stylesheet loads with it. Nothing in it paints console markup: every
       rule is namespaced `.set2-`, apart from `kbd` and `.w-lock`, neither of
       which the console renders. -->
  <link rel="stylesheet" href="assets/settings.css?v=490" />

  <script>

    (function () {
      try {
        var saved = localStorage.getItem('aimy-ds-theme');
        if (saved === 'light') document.documentElement.setAttribute('data-theme', 'light');
      } catch (e) {}
    })();
  </script>

          <span class="rail-back-name">Back to chat</span>
          <span class="rail-back-sub">Ask across everything AiMY knows</span>
        </span>
      </a>
    </div>
  </nav>

  <!-- Dismiss surface for the drawer. Sibling of the rail so the two share one
       stacking context and their z-indexes mean something relative to each
       other. Inert and out of the tree until the drawer opens. -->
  <div class="rail-scrim" id="railScrim"></div>

  <!-- ══════════════════════════════════════════════
       MAIN — filters → grid → viewer → editor, all in place
  ══════════════════════════════════════════════ -->
  <main class="app-main">
    <div class="page-scroll" id="pageScroll">
      <div class="page-inner">

      <!-- The filters, visible. Chat sets these same controls, so what AiMY
           understood is shown by the controls lighting up rather than said in
           prose underneath them. -->
      <div id="filterBar"></div>

      <!-- Only for what a dropdown cannot say: several values on one axis,
           free text, an answer's document set, a custom property. -->
      <div id="chipBar"></div>

      <!-- The surface: always the grid. Documents open over it, never instead
           of it. -->
      <div id="wbStage"></div>

      </div>
    </div>

    <!-- ══ The settings sheet. Same overlay pattern as a document, because it
         is the same kind of thing: something you open over the work, act on,
         and close. `?settings=source:confluence` — addressable, so a setting
         can be linked to like everything else here. ══ -->
    <div class="doc-overlay" id="setOverlay" role="dialog" aria-modal="true" aria-label="Settings" hidden>
      <div class="doc-sheet is-settings" id="setSheet"></div>
    </div>

    <!-- ══ The input. Not a chat box — it drives the page. Four routes.
         Fixed and centred on the WINDOW, not on the main column. ══ -->
    <div class="aimy-float-wrap" id="aimyFloatWrap">
      <!-- The row that teaches the input what it takes.

           Nine filters left the filter row because the input already speaks
           them, and a filter you can only reach by knowing the word is not a
           filter. Every chip here is a word the lexicon understands, so
           clicking one and typing it do the same thing — which is the whole
           lesson: these are examples, not the list.

           `trust=expired` and `trust=due` stood here and did nothing. `trust`
           is not a filter key, so addFilter fell through to its else branch,
           serialize never wrote it and the chip changed nothing. Same defect as
           the Work state dropdown that left the row. -->
      <div class="filter-tray" id="floatFilterTray">
        <div class="filter-tray-inner">
          <button class="filter-chip" data-quick="status=conflicting">Conflicting</button>
          <button class="filter-chip" data-quick="status=unowned">Unowned</button>
          <button class="filter-chip" data-quick="status=outdated">Out of date</button>
          <button class="filter-chip" data-quick="mine=1">Mine</button>
        </div>
      </div>

      <div class="aimy-float-bar" id="aimyFloatBar">
        <!-- Also the way back. Opening a document closes the canvas, and this
             mark reopens the same thread — it already carries the unread count,
             so it is already the thing on screen that means AiMY has something
             for you. -->
        <button class="aimy-float-icon" id="canvasOpen" type="button" aria-label="Open the AiMY canvas">
          <!-- Counts what AiMY did while you were reading something else. The
               canvas collects rather than interrupts, so this is how the record
               announces itself. -->
          <span class="float-badge" hidden aria-label="unread in the canvas">0</span>
          <svg width="18" height="20" viewBox="0 0 18 20"><use href="#aimy-logo-small"/></svg>
        </button>
        <input class="aimy-float-input" id="floatInput" type="text"
               placeholder="Ask, filter, or name a document…"
               autocomplete="off" spellcheck="false" aria-label="Drive the surface" />
        <span class="aimy-float-hint">Enter to run</span>
        <button class="aimy-float-send" id="floatSend" aria-label="Run">
          <svg class="send-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/></svg>
        </button>
      </div>
    </div>

    <!-- ══ Canvas overlay — opens for questions and generative work only.
         Not for filtering, not for opening a known document, not for writes. ══ -->
    <div class="aimy-overlay" id="aimyOverlay" role="dialog" aria-label="AiMY Canvas">

      <!-- ══ THE CONVERSATIONS COLUMN ══════════════════════════════════════
           A log of conversations is not navigation, which is why it is not in
           the app sidebar — that rail is the briefing and says so in as many
           words. It is navigation INSIDE a conversation, which is what this
           column is and where it belongs.

           Empty here and painted by `paintChats`: every row is a thread that
           only exists at runtime. Ported from AiMY Sales, the one product in
           the ecosystem that had it; the deviation is declared in README.md.
      ══════════════════════════════════════════════════════════════════ -->
      <aside class="overlay-chats" id="overlayChats" aria-label="Conversations"></aside>

      <!-- ══ AND THE THREAD BEHIND IT IS DISMISSABLE ══════════════════════
           The briefing rail has had a scrim since it became a drawer, and the
           gate has one; this drawer was the only one of the three without. It
           cost two things. A drawer over a thread that does not dim reads as a
           column that has appeared BESIDE the thread rather than over it, and
           — the real defect — pressing the thread was the one gesture that
           obviously ought to shut it and did nothing, leaving the toggle in
           the drawer's own top-left corner as the only way out.

           Inside `.aimy-overlay` and `position: absolute`, not `fixed`: the
           canvas is itself fixed and, below 720, inset to the top of the
           window — a scrim against the VIEWPORT would start above the surface
           it belongs to. Against its own overlay it cannot.

           Present at every width, painted at none of them until the drawer
           exists, which is `.rail-scrim`'s own pattern in this file. -->
      <div class="ov-chats-scrim" id="ovChatsScrim"></div>

      <div class="overlay-main">
        <!-- Below 900px the conversations column is a drawer rather than a
             fixed rail, for the same reason the briefing is: the thread needs
             the width, and deleting the list is not the same as ranking it
             second. -->
        <button class="ov-chats-toggle" id="ovChatsToggle" type="button"
                aria-expanded="false" aria-controls="overlayChats"
                aria-label="Conversations" title="Conversations">
          <!-- Lucide `panel-left`, the same glyph the rail toggle above carries
               and the same one AiMY Sales now uses on ITS conversation toggle.
               It was three bars: a hamburger says "a menu", and what this opens
               is a PANEL beside the thread — which is the distinction the
               panel-left glyph draws and the reason the rail already uses it.
               Two controls doing the same job across two products, one glyph. -->
          <svg viewBox="0 0 24 24" aria-hidden="true" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg>
        </button>
        <div class="overlay-badge">
          <svg width="11" height="11" viewBox="0 0 18 20"><use href="#aimy-logo-small"/></svg>
          AiMY Canvas
        </div>
        <button class="overlay-close" data-overlay-close aria-label="Close canvas">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
          </svg>
        </button>

        <!-- The canvas shows its basis without being asked (§4, Level 5).
             Absolutely positioned, so revealing it never shifts the thread. -->
        <div class="overlay-context-bar" id="overlayContextBar">
          <span class="overlay-context-label">Based on</span>
          <div class="overlay-context-tags" id="overlayContextTags"></div>
        </div>

        <!-- The openers are drawn by `paintThread` now, not written here. Static
             markup could only ever be hidden, never brought back — and a thread you
             switch away from and return to empty has to show them again. A thing
             that should come back has to be rendered, not hidden. -->
        <div class="overlay-thread" id="overlayThread" aria-live="polite"></div>

        <div class="overlay-input-wrap">
          <div class="overlay-input-bar">
            <div class="aimy-float-icon">
              <svg width="16" height="18" viewBox="0 0 18 20"><use href="#aimy-logo-small"/></svg>
            </div>
            <textarea class="overlay-input" id="overlayInput" placeholder="Ask AiMY anything…" rows="1"
                      spellcheck="false" autocomplete="off" data-submit-on-enter aria-label="Ask AiMY"></textarea>
            <button class="overlay-send" id="overlaySend" aria-label="Send">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/></svg>
            </button>
          </div>
        </div>
      </div><!-- /.overlay-main -->
    </div>
  </main>
</div>

<!-- Drop a file anywhere on the workbench. Covers the whole window, because
     asking someone to aim at a target is the thing drag and drop exists to avoid. -->
<div class="drop-layer" id="dropLayer" hidden aria-hidden="true">
  <div class="drop-card">
    <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m17 8-5-5-5 5"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/></svg>
    <span class="drop-title">Drop to add to the corpus</span>
    <span class="drop-sub">A draft per file, owned by you. Nothing goes live until you say so.</span>
  </div>
</div>

<!-- Commit surfaces and toasts mount here -->
<!-- The peek: one panel, anchored by script to whatever entity was
     clicked. Lives at the body so it can be anchored to anything. -->
<div class="peek" id="peek" role="dialog" aria-label="About this" hidden></div>

<div id="commitHost"></div>
<div id="toastHost"></div>
<!-- Where a run and its receipt land. Outside the grid, because a commit can
     change the page under them and neither should be repainted away. -->
<div id="agentHost" hidden></div>


<!-- Where the settings modals mount: the dry run, the typed-count deletions,
     the new-skill sheet, the file upload, adding people. It lives at the body
     for the same reason the peek does — a dialog anchored inside the scroll
     port inherits that port's clipping and its stacking context, and neither
     is something a modal should be subject to.

     This was missing when settings moved off its own page, and nothing said
     so: `paintModal` writes into `$('#setModal')`, which was null, so every
     modal in the file failed silently on a host that was never there. -->
<div id="setModal"></div>

<!-- ══════════════════════════════════════════════
     PROTOTYPE CONTROLS — not product UI.

     Collapsed to an icon in the bottom-right corner, expanding upward on click.
     Fixed, so it can never push anything; lifted above the input band on the
     widths where the two would otherwise overlap, because the bottom-centre
     band belongs to the input and the toast and a dev tool does not get to
     take it.

     Its contents are rendered from the live corpus rather than hard-coded, so
     every link resolves to a document that really is in that state — which is
     the point of it at this stage: reaching a superseded document with nothing
     linked, or a source that is down, should be one click and not a hunt.
══════════════════════════════════════════════ -->
<div class="proto" id="proto">
  <div class="proto-panel" id="protoPanel" hidden></div>
  <button class="proto-toggle" id="protoToggle" type="button"
          aria-expanded="false" aria-controls="protoPanel"
          aria-label="Prototype controls" title="Prototype controls">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M10 5H3"/><path d="M12 19H3"/><path d="M14 3v4"/><path d="M16 17v4"/><path d="M21 12h-9"/><path d="M21 19h-5"/><path d="M21 5h-7"/><path d="M8 10v4"/><path d="M8 12H3"/></svg>
  </button>
</div>

<!-- BEFORE knowledge.js, the way chat.js loads before it on the gate. Two

<script src="assets/settings.js?v=482"></script>
